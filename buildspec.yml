version: 0.2

# CodeBuild spec for the Lambda image build project.
#
# Builds the arm64 Rust Lambda container image and pushes it to ECR with two
# tags: the immutable commit SHA (consumed by the CDK deploy stage) and
# `latest`. MUST run on an ARM compute image with privileged mode enabled so
# the Dockerfile compiles natively for aarch64.
#
# Required environment variables (set by the CDK CodeBuild project):
#   AWS_ACCOUNT_ID  - account hosting the ECR repository
#   AWS_REGION      - region of the ECR repository (usually $AWS_DEFAULT_REGION)
#   ECR_REPO_NAME   - name of the ECR repository

env:
  variables:
    DOCKER_BUILDKIT: "1"

phases:
  pre_build:
    commands:
      - REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - IMAGE_URI="${REGISTRY}/${ECR_REPO_NAME}"
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - echo "Logging in to ECR ${REGISTRY}"
      - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${REGISTRY}"
  build:
    commands:
      - echo "Building ${IMAGE_URI}:${IMAGE_TAG}"
      - docker build -t "${IMAGE_URI}:${IMAGE_TAG}" -t "${IMAGE_URI}:latest" .
  post_build:
    commands:
      - docker push "${IMAGE_URI}:${IMAGE_TAG}"
      - docker push "${IMAGE_URI}:latest"
      # Hand the immutable tag to the pipeline's deploy stage.
      - printf '{"imageTag":"%s","imageUri":"%s"}' "${IMAGE_TAG}" "${IMAGE_URI}:${IMAGE_TAG}" > imageDetail.json

artifacts:
  files:
    - imageDetail.json
